<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StratG — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --white: #FFFFFF;
    --warm: #F5F2EE;
    --dark: #1A1A18;
    --accent: #E8521A;
    --muted: rgba(255,255,255,0.45);
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dark);
    color: var(--white);
    cursor: none;
  }

  /* CUSTOM CURSOR */
  .cursor {
    position: fixed;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease;
  }
  .cursor-ring {
    position: fixed;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(232,82,26,0.5);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform 0.12s ease, width 0.3s ease, height 0.3s ease, opacity 0.3s;
  }

  /* NOISE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.35;
    pointer-events: none;
    z-index: 1;
  }

  /* BG VIDEO/GRADIENT */
  .bg {
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 60% 80% at 80% 50%, rgba(232,82,26,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 10% 80%, rgba(232,82,26,0.05) 0%, transparent 50%),
      #1A1A18;
    z-index: 0;
  }

  /* ANIMATED LINES */
  .lines {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .line {
    position: absolute;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.04), transparent);
    animation: lineFade 8s ease-in-out infinite;
  }
  .line:nth-child(1) { left: 20%; height: 100%; animation-delay: 0s; }
  .line:nth-child(2) { left: 40%; height: 100%; animation-delay: 2s; }
  .line:nth-child(3) { left: 60%; height: 100%; animation-delay: 4s; }
  .line:nth-child(4) { left: 80%; height: 100%; animation-delay: 6s; }

  @keyframes lineFade {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }

  /* LAYOUT */
  .page {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(2rem, 5vw, 4rem);
  }

  /* TOP NAV */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    animation: fadeUp 1s ease 0.2s forwards;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(18px, 2.5vw, 24px);
    letter-spacing: -0.03em;
    color: var(--white);
  }
  .logo span { color: var(--accent); }

  .nav-tag {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 6px 14px;
    border-radius: 100px;
  }

  /* MAIN */
  main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 900px;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.5s forwards;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .eyebrow::before {
    content: '';
    display: block;
    width: 32px;
    height: 1px;
    background: var(--accent);
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(52px, 10vw, 120px);
    line-height: 0.92;
    letter-spacing: -0.03em;
    color: var(--white);
    opacity: 0;
    animation: fadeUp 1s ease 0.7s forwards;
    margin-bottom: 2.5rem;
  }

  h1 .outline {
    -webkit-text-stroke: 1px rgba(255,255,255,0.25);
    color: transparent;
  }

  h1 .accent-word {
    color: var(--accent);
    display: inline-block;
    animation: shimmer 4s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .description {
    font-size: clamp(15px, 2vw, 18px);
    font-weight: 300;
    line-height: 1.7;
    color: var(--muted);
    max-width: 480px;
    opacity: 0;
    animation: fadeUp 1s ease 0.9s forwards;
    margin-bottom: 3rem;
  }

  /* EMAIL FORM */
  .notify-form {
    display: flex;
    gap: 0;
    max-width: 420px;
    opacity: 0;
    animation: fadeUp 1s ease 1.1s forwards;
  }

  .notify-form input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-right: none;
    border-radius: 100px 0 0 100px;
    padding: 14px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--white);
    outline: none;
    transition: border-color 0.3s, background 0.3s;
  }
  .notify-form input::placeholder { color: rgba(255,255,255,0.25); }
  .notify-form input:focus {
    background: rgba(255,255,255,0.08);
    border-color: rgba(232,82,26,0.5);
  }

  .notify-form button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 0 100px 100px 0;
    padding: 14px 24px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: none;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
  }
  .notify-form button:hover { opacity: 0.88; }
  .notify-form button:active { transform: scale(0.98); }

  .form-success {
    display: none;
    font-size: 14px;
    color: var(--accent);
    padding: 14px 0;
    letter-spacing: 0.02em;
  }

  /* FOOTER */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    opacity: 0;
    animation: fadeUp 1s ease 1.3s forwards;
  }

  .contact-link {
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.02em;
    transition: color 0.2s;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 2px;
  }
  .contact-link:hover { color: var(--white); border-color: var(--white); }

  .socials {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .socials a {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    text-decoration: none;
    transition: color 0.2s;
  }
  .socials a:hover { color: var(--white); }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* MOBILE */
  @media (max-width: 600px) {
    .page { padding: 1.75rem; }
    .notify-form { flex-direction: column; gap: 10px; max-width: 100%; }
    .notify-form input { border-right: 1px solid rgba(255,255,255,0.12); border-radius: 100px; }
    .notify-form button { border-radius: 100px; padding: 14px; }
    footer { flex-direction: column; gap: 1.5rem; align-items: flex-start; }
    .cursor, .cursor-ring { display: none; }
    body { cursor: auto; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="bg"></div>
<div class="lines">
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
</div>

<div class="page">

  <nav>
    <div class="logo">Strat<span>G</span></div>
    <div class="nav-tag">Sydney, AU</div>
  </nav>

  <main>
    <div class="eyebrow">Something is coming</div>

    <h1>
      Strategy<br>
      that <span class="accent-word">moves</span><br>
      <span class="outline">the needle.</span>
    </h1>

    <p class="description">
      Freelance social media specialist helping brands grow with intentional content and data-backed strategy. Full site launching soon.
    </p>

    <div class="notify-form" id="notifyForm">
      <input type="email" placeholder="your@email.com" id="emailInput">
      <button onclick="handleSubmit()">Notify me →</button>
    </div>
    <div class="form-success" id="formSuccess">
      ✓ &nbsp;You're on the list. Talk soon.
    </div>
  </main>

  <footer>
    <a href="mailto:hello@stratg.com.au" class="contact-link">hello@stratg.com.au</a>
    <div class="socials">
      <div class="status-dot">
        <div class="dot"></div>
        In development
      </div>
    </div>
  </footer>

</div>

<script>
  // Custom cursor
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.left = mx + 'px';
    cursor.style.top = my + 'px';
  });

  function animRing() {
    rx += (mx - rx) * 0.12;
    ry += (my - ry) *.12;
    ring.style.left = rx + 'px';
    ring.style.top = ry + 'px';
    requestAnimationFrame(animRing);
  }
  animRing();

  document.querySelectorAll('a, button, input').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cursor.style.width = '6px';
      cursor.style.height = '6px';
      ring.style.width = '48px';
      ring.style.height = '48px';
    });
    el.addEventListener('mouseleave', () => {
      cursor.style.width = '10px';
      cursor.style.height = '10px';
      ring.style.width = '36px';
      ring.style.height = '36px';
    });
  });

  // Form
  function handleSubmit() {
    const email = document.getElementById('emailInput').value;
    if (!email || !email.includes('@')) {
      document.getElementById('emailInput').style.borderColor = 'rgba(232,82,26,0.8)';
      return;
    }
    document.getElementById('notifyForm').style.display = 'none';
    document.getElementById('formSuccess').style.display = 'block';
  }

  document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSubmit();
  });
</script>
</body>
</html>
